services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: spotify-jockey-backend
    restart: unless-stopped
    volumes:
      - ./data:/app/data
      - ./backend/app:/app/app
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8000/api/health\")'"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: spotify-jockey-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/views:/app/views
      - ./frontend/server.js:/app/server.js

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: spotify-jockey-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs
    depends_on:
      - frontend
      - backend
